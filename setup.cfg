[metadata]
name = bleach_extras
version = attr: bleach_extras.__version__
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/bleach_extras
license_expression = MIT
description = some extensions for bleach
long_description = file: README.md
long_description_content_type = text/markdown
keywords = bleach html-sanitizing
classifiers =
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Intended Audience :: Developers

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
install_requires =
    bleach>=6.4.0,<7
    packaging>=21
include_package_data = True
zip_safe = False

[options.packages.find]
where = src

[options.package_data]
bleach_extras = py.typed

[options.extras_require]
css =
    bleach[css]>=6.4.0,<7
testing =
    pytest>=8
    pytest-wholenodeid
    flake8
    mypy
    tox>=4
    types-bleach
    bleach[css]>=6.4.0,<7
    build
docs =
    Sphinx
release =
    twine

[flake8]
exclude =
    .git/,
    .tox/,
ignore =
    # E731: do not assign a lambda expression, use a def
    E731,
    # W503: line break occurred before a binary operator
    W503
max-line-length = 80

per-file-ignores =
	demo.py: E501
	src/bleach_extras/tag_tree_filter.py: E501
	tests/test_clean.py: E501,F841

application_import_names = bleach_extras
import_order_style = appnexus

[tox:tox]
envlist = py310,py311,py312,py313,py314,lint,mypy

[testenv]
extras = testing
commands =
    pytest {posargs:}
    python -m build

[testenv:lint]
commands = flake8 src tests demo.py

[testenv:mypy]
commands = mypy
